<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Unine Login Test
</title>


<style>


*{
    box-sizing:border-box;
}


body{

    margin:0;

    padding:30px;

    font-family:Arial,sans-serif;

    background:#f5f5f5;

}


.container{

    max-width:500px;

    margin:auto;

}


.box{

    background:white;

    padding:20px;

    margin-bottom:20px;

    border-radius:12px;

    border:1px solid #ddd;

}



h2{

    margin-top:0;

}



input{

    width:100%;

    padding:12px;

    margin-bottom:12px;

    border-radius:6px;

    border:1px solid #ccc;

    font-size:15px;

}



button{

    width:100%;

    padding:12px;

    background:#2762ea;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:15px;

}



button:hover{

    opacity:.85;

}



.result{

    margin-top:15px;

    background:#111;

    color:white;

    padding:15px;

    border-radius:8px;

    white-space:pre-wrap;

    font-family:monospace;

    font-size:13px;

}



.status{

    padding:12px;

    background:#eee;

    border-radius:8px;

    margin-bottom:20px;

}



</style>


</head>


<body>


<div class="container">


<h1>
Unine Auth
</h1>



<div class="status">

Status:

<span id="status">
Checking...
</span>


</div>




<!-- LOGIN -->

<div class="box">


<h2>
Login
</h2>


<input
id="login"
placeholder="Username or Email"
>


<input
id="password"
type="password"
placeholder="Password"
>


<button onclick="loginUser()">

Login

</button>


<div
id="loginResult"
class="result"
>

Waiting...

</div>


</div>





<!-- CHANGE PASSWORD -->


<div class="box">


<h2>
Change Password
</h2>



<input
id="currentPassword"
type="password"
placeholder="Current Password"
>


<input
id="newPassword"
type="password"
placeholder="New Password"
>


<input
id="confirmPassword"
type="password"
placeholder="Confirm New Password"
>


<button onclick="changePassword()">

Change Password

</button>



<div
id="passwordResult"
class="result"
>

Waiting...

</div>



</div>





<!-- API -->


<div class="box">


<h2>
Last API Response
</h2>


<div
id="apiResult"
class="result"
>

No request

</div>


</div>



</div>





<script>


const API_BASE =

"https://layzcgktgtrqvsgxwwyc.supabase.co/functions/v1";





async function apiRequest(
    endpoint,
    options={}
){


    const response =

    await fetch(
        API_BASE + endpoint,
        {

            credentials:"include",

            headers:{

                "Content-Type":
                "application/json"

            },

            ...options

        }
    );



    let data;


    try{

        data =
        await response.json();

    }
    catch{

        data={

            success:false,

            error:"Invalid JSON"

        };

    }



    document.getElementById(
        "apiResult"
    ).textContent =

    JSON.stringify(

        {

            status:
            response.status,

            data

        },

        null,

        2

    );



    return {

        response,

        data

    };


}








/*
==========================
LOGIN
==========================
*/


async function loginUser(){


    const login =

    document.getElementById(
        "login"
    ).value.trim();



    const password =

    document.getElementById(
        "password"
    ).value;



    const result =

    document.getElementById(
        "loginResult"
    );



    if(
        !login ||
        !password
    ){

        result.textContent =
        "Please enter login and password";

        return;

    }



    result.textContent =
    "Logging in...";



    try{


        const {

            response,

            data

        }

        =

        await apiRequest(
            "/login",
            {

                method:"POST",

                body:

                JSON.stringify({

                    login,

                    password

                })

            }
        );



        result.textContent =

        JSON.stringify(
            data,
            null,
            2
        );



        if(
            response.ok &&
            data.success
        ){

            checkSession();

        }



    }

    catch(error){


        result.textContent =

        error.message;


    }


}










/*
==========================
CHANGE PASSWORD
==========================
*/


async function changePassword(){


    const currentPassword =

    document.getElementById(
        "currentPassword"
    ).value;



    const newPassword =

    document.getElementById(
        "newPassword"
    ).value;



    const confirmPassword =

    document.getElementById(
        "confirmPassword"
    ).value;



    const result =

    document.getElementById(
        "passwordResult"
    );




    if(
        !currentPassword ||
        !newPassword ||
        !confirmPassword
    ){

        result.textContent =
        "Please fill all fields";

        return;

    }



    if(
        newPassword !== confirmPassword
    ){

        result.textContent =
        "Password does not match";

        return;

    }



    result.textContent =
    "Changing password...";



    try{


        const {

            response,

            data

        }

        =

        await apiRequest(
            "/change-password",
            {

                method:"POST",

                body:

                JSON.stringify({

                    current_password:
                    currentPassword,


                    new_password:
                    newPassword

                })

            }
        );



        result.textContent =

        JSON.stringify(
            data,
            null,
            2
        );



        if(
            response.ok &&
            data.success
        ){


            document.getElementById(
                "currentPassword"
            ).value="";


            document.getElementById(
                "newPassword"
            ).value="";


            document.getElementById(
                "confirmPassword"
            ).value="";


            checkSession();


        }



    }

    catch(error){


        result.textContent =
        error.message;


    }


}










/*
==========================
CHECK SESSION
==========================
*/


async function checkSession(){


    try{


        const {

            data

        }

        =

        await apiRequest(
            "/me",
            {

                method:"GET"

            }
        );



        if(
            data.success &&
            data.logged_in
        ){

            document.getElementById(
                "status"
            ).textContent =
            "LOGGED IN";


        }

        else{


            document.getElementById(
                "status"
            ).textContent =
            "NOT LOGGED IN";


        }



    }

    catch{


        document.getElementById(
            "status"
        ).textContent =
        "ERROR";


    }


}




document.addEventListener(
"DOMContentLoaded",
()=>{

    checkSession();

});



</script>


</body>

</html>
