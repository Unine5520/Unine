<body>


  <!-- =================================================
      HEADER
  ================================================= -->

  <header id="U9-page-header">


    <!-- =========================
        UNINE LOGO
    ========================= -->

    <div id="U9-page-header-u9-logo">

      <img
        src="SSVG/logo/uninelogo.svg"
        alt="Unine"
      >

    </div>


    <!-- =========================
        HEADER ACTIONS
    ========================= -->

    <div id="U9-page-header-actions">


      <!-- REGISTER -->

      <button
        id="U9-page-header-register"
        type="button"
      >
        Register
      </button>


      <!-- LOGIN -->

      <button
        id="U9-page-header-login"
        type="button"
      >
        Login
      </button>


      <!-- USER -->

      <button
        id="U9-page-header-user"
        type="button"
      >

        <svg
          id="U9-page-header-user-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <circle
            cx="12"
            cy="8"
            r="4"
          />

          <path
            d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"
          />

        </svg>


        <span
          id="U9-page-header-username"
        ></span>

      </button>

    </div>

  </header>


  <!-- =================================================
      CONTAINER TOOL
  ================================================= -->

  <div id="U9-page-container-tool">


    <!-- =========================
        NORMAL TOOL
    ========================= -->

    <div id="U9-page-container-tool-normal">


      <!-- MENU -->

      <button
        id="U9-page-container-tool-menu"
        type="button"
      >

        <img
          src="SSVG/button/menu.svg"
          alt=""
          aria-hidden="true"
        >

      </button>


      <!-- SEARCH -->

      <div id="U9-page-container-tool-search">

        <input
          id="U9-page-container-tool-search-input"
          type="text"
          placeholder="Search..."
          autocomplete="off"
        >


        <button
          id="U9-page-container-tool-search-button"
          type="button"
        >

          <img
            src="SSVG/button/search.svg"
            alt=""
            aria-hidden="true"
          >

        </button>

      </div>


      <!-- MESSAGE -->

      <button
        id="U9-page-container-tool-message"
        type="button"
      >

        <img
          src="SSVG/button/message.svg"
          alt=""
          aria-hidden="true"
        >

      </button>


      <!-- INBOX -->

      <button
        id="U9-page-container-tool-inbox"
        type="button"
      >

        <img
          src="SSVG/button/inbox.svg"
          alt=""
          aria-hidden="true"
        >

      </button>


      <!-- GIFT -->

      <button
        id="U9-page-container-tool-gift"
        type="button"
      >

        <img
          src="SSVG/button/gift.svg"
          alt=""
          aria-hidden="true"
        >

      </button>


      <!-- HISTORY -->

      <button
        id="U9-page-container-tool-history"
        type="button"
      >

        <img
          src="SSVG/button/history.svg"
          alt=""
          aria-hidden="true"
        >

      </button>

    </div>


    <!-- =========================
        PAGE MENU
    ========================= -->

    <div id="U9-page-container-tool-pages">


      <!-- NEW -->

      <button
        id="U9-page-container-tool-new"
        type="button"
        aria-label="New"
      >

        <img
          src="SSVG/button/new.svg"
          alt=""
        >

      </button>


      <!-- HOME -->

      <button
        id="U9-page-container-tool-home"
        type="button"
      >
        Home
      </button>


      <!-- SHOP -->

      <button
        id="U9-page-container-tool-shop-page"
        type="button"
      >
        Shop
      </button>


      <!-- AUCTION -->

      <button
        id="U9-page-container-tool-auction"
        type="button"
      >
        Auction
      </button>


      <!-- TEST 1 -->

      <button
        id="U9-page-container-tool-test1"
        type="button"
      >
        Test1
      </button>


      <!-- TEST 2 -->

      <button
        id="U9-page-container-tool-test2"
        type="button"
      >
        Test2
      </button>

    </div>

  </div>

    <!-- SHOP -->

    <!-- AUCTION -->

    </div>


    <!-- TEST 1 -->

    <div id="U9-page-test1">
      Test1
    </div>


    <!-- TEST 2 -->

    <div id="U9-page-test2">
      Test2
    </div>

  </div>


  <!-- =================================================
      ACCOUNT SETTING
  ================================================= -->

  <div id="U9-account-setting">


    <div id="U9-account-setting-content">


      <!-- =========================
          ACCOUNT SETTING HEADER
      ========================= -->

      <div id="U9-account-setting-header">


        <!-- =========================
            ADD FRIEND HEADER
        ========================= -->

        <div
          id="Account-U9-account-add-friend-page-header"
        >


          <!-- BACK -->

          <button
            id="Account-U9-account-add-friend-page-back"
            type="button"
            aria-label="Back"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M9 6L15 12L9 18"
              ></path>

            </svg>

          </button>


          <!-- TITLE -->

          <span
            id="Account-U9-account-add-friend-page-header-text"
          >
            Add Friend
          </span>

        </div>


        <!-- =========================
            ACCOUNT HEADER
        ========================= -->

        <div
          id="Account-U9-account-header"
          class="active"
        >


          <!-- CLOSE -->

          <button
            id="Account-U9-account-setting-back"
            type="button"
            aria-label="Close"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M6 6L18 18"
              ></path>

              <path
                d="M18 6L6 18"
              ></path>

            </svg>

          </button>


          <!-- TITLE -->

          <span
            id="Account-U9-account-header-text"
          >
            Account
          </span>

        </div>


        <!-- =========================
            SETTING / EDIT / FRAME EDIT
        ========================= -->

        <div
          id="Account-U9-account-setting-page-header"
        >


          <!-- BACK -->

          <button
            id="Account-U9-account-setting-page-back"
            type="button"
            aria-label="Back"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M15 6L9 12L15 18"
              ></path>

            </svg>

          </button>


          <!-- TITLE -->

          <span
            id="Account-U9-account-setting-page-header-text"
          >
            Setting
          </span>

        </div>

      </div>


      <!-- =========================
          ACCOUNT SETTING PAGES
      ========================= -->

      <div
        id="Account-U9-account-setting-pages"
      >


        <!-- =================================================
            1. ADD FRIEND PAGE
        ================================================= -->

        <div
          id="Account-U9-account-add-friend-page"
        >
        </div>


        <!-- =================================================
            2. ACCOUNT PAGE
        ================================================= -->

        <div
          id="Account-U9-account-page"
        >


          <!-- =========================
              ACCOUNT ACTIONS
          ========================= -->

          <div
            id="Account-U9-account-actions"
          >


            <!-- ADD FRIEND -->

            <button
              id="Account-U9-account-add-friend"
              type="button"
              aria-label="Add Friend"
            >

              <img
                src="SSVG/account/add-friend-button.svg"
                alt=""
              >

            </button>


            <!-- RIGHT ACTIONS -->

            <div
              id="Account-U9-account-right-actions"
            >


              <!-- SETTING -->

              <button
                id="Account-U9-account-setting-button"
                type="button"
                aria-label="Setting"
              >

                <img
                  src="SSVG/account/account-setting-button.svg"
                  alt=""
                >

              </button>


              <!-- ACCOUNT EDIT -->

              <button
                id="Account-U9-account-edit-profile"
                type="button"
                aria-label="Account Edit"
              >

                <img
                  src="SSVG/account/account-edit-button.svg"
                  alt=""
                >

              </button>

            </div>

          </div>


          <!-- =========================
              ACCOUNT PROFILE
          ========================= -->

          <div
            id="Account-U9-account-profile"
          >


            <!-- AVATAR -->

            <div
              id="Account-U9-account-avatar"
            >

              <!-- AVATAR IMAGE -->

              <img
                id="Account-U9-account-avatar-image"
                src="SSVG/avatar/profile.svg"
                alt="Avatar"
              >


              <!-- AVATAR FRAME -->

              <img
                id="Account-U9-account-avatar-frame"
                src=""
                alt=""
              >

            </div>


            <!-- USERNAME -->

            <div
              id="Account-U9-account-username"
            ></div>


            <!-- ACCOUNT -->

            <div
              id="Account-U9-account-account"
            ></div>

          </div>


          <!-- =========================
              FUTURE CONTENT
          ========================= -->

          <div
            id="Account-U9-account-setting-future"
          >
          </div>

        </div>


        <!-- =================================================
            3. SETTING PAGE
        ================================================= -->

        <div
          id="Account-U9-account-setting-page"
        >


          <!-- LOGOUT -->

          <button
            id="Account-U9-account-logout"
            type="button"
          >

            <img
              src="SSVG/account/account-setting-logout-button.svg"
              alt=""
            >

            <span>
              Logout
            </span>

          </button>

        </div>


        <!-- =================================================
            4. ACCOUNT EDIT PAGE
        ================================================= -->

        <div
          id="Account-U9-account-edit-page"
        >


          <!-- FRAME EDIT -->

          <button
            id="Account-U9-account-frame-edit"
            type="button"
          >
            Frame Edit
          </button>

        </div>


        <!-- =================================================
            5. FRAME EDIT PAGE
        ================================================= -->

        <div
          id="Account-U9-account-edit-profile-page"
        >
        </div>

      </div>

    </div>

  </div>


  <!-- =================================================
      REGISTER MODAL
  ================================================= -->

  <div id="U9-register-modal">


    <div id="U9-register-modal-content">


      <button
        id="U9-register-modal-close"
      >
        ×
      </button>


      <h2>
        Register
      </h2>


      <form
        id="U9-register-form"
      >


        <label
          for="U9-register-username"
        >
          Username
        </label>


        <input
          type="text"
          id="U9-register-username"
          name="username"
          autocomplete="username"
          required
        >


        <label
          for="U9-register-email"
        >
          Email
        </label>


        <input
          type="email"
          id="U9-register-email"
          name="email"
          autocomplete="email"
          required
        >


        <label
          for="U9-register-password"
        >
          Password
        </label>


        <div
          id="U9-register-password-wrapper"
        >

          <input
            type="password"
            id="U9-register-password"
            name="password"
            autocomplete="new-password"
            required
          >


          <button
            type="button"
            id="U9-register-password-toggle"
          >
            Show
          </button>

        </div>


        <label
          for="U9-register-confirm-password"
        >
          Confirm Password
        </label>


        <div
          id="U9-register-confirm-password-wrapper"
        >

          <input
            type="password"
            id="U9-register-confirm-password"
            name="confirm-password"
            autocomplete="new-password"
            required
          >


          <button
            type="button"
            id="U9-register-confirm-password-toggle"
          >
            Show
          </button>

        </div>


        <button
          type="submit"
          id="U9-register-submit"
        >
          Register
        </button>

      </form>

    </div>

  </div>


  <!-- =================================================
      LOGIN MODAL
  ================================================= -->

  <div id="U9-login-modal">


    <div id="U9-login-modal-content">


      <button
        id="U9-login-modal-close"
      >
        ×
      </button>


      <h2>
        Login
      </h2>


      <form
        id="U9-login-form"
      >


        <label
          for="U9-login-email"
        >
          Email
        </label>


        <input
          type="email"
          id="U9-login-email"
          name="email"
          autocomplete="email"
          required
        >


        <label
          for="U9-login-password"
        >
          Password
        </label>


        <div
          id="U9-login-password-wrapper"
        >

          <input
            type="password"
            id="U9-login-password"
            name="password"
            autocomplete="current-password"
            required
          >


          <button
            type="button"
            id="U9-login-password-toggle"
          >
            Show
          </button>

        </div>


        <button
          type="submit"
          id="U9-login-submit"
        >
          Login
        </button>

      </form>

    </div>

  </div>


  <!-- =================================================
      LOGOUT CONFIRM MODAL
  ================================================= -->

  <div id="U9-account-logout">


    <div id="U9-account-logout-content">


      <h2>
        你确认退出吗？
      </h2>


      <div id="U9-account-logout-actions">


        <button
          id="U9-account-logout-no"
          type="button"
        >
          No
        </button>


        <button
          id="U9-account-logout-yes"
          type="button"
          disabled
        >
          Yes
          (
          <span id="U9-account-logout-countdown">
            5
          </span>
          )
        </button>

      </div>

    </div>

  </div>

      MESSAGE MODAL
  ================================================= -->

  <div id="U9-message-normal-modal">


    <div id="U9-message-normal-modal-content">


      <div id="U9-message-normal-modal-title">

      <button

        type="button"

    </div>

  </div>
