<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0"
>

<meta 
    name="description" 
    content="U9"
>

<title>
    U9
</title>


<!-- ======== GLOBAL CSS ======== -->
<!-- ======== GLOBAL CSS ======== -->
<!-- ======== GLOBAL CSS ======== -->

<link rel="stylesheet" href="index.css">


</head>

<body>

<!-- ======== RL MODAL ======== -->
<!-- ======== RL MODAL ======== -->
<!-- ======== RL MODAL ======== -->

<div id="rlModal" class="rl-modal hidden">

<div class="rl-box">

<!-- HEADER -->

<div class="rl-header">


<button 
    id="rlClose"
    class="rl-close"
    type="button"
>

<svg
    viewBox="0 0 72 72"
    width="32"
    height="32"
>

<circle
    cx="36"
    cy="36"
    r="35"
    fill="#6D7693"
    stroke="#fff"
    stroke-width="2"
/>

<path
    d="M27 27 L45 45 M45 27 L27 45"
    stroke="white"
    stroke-width="5"
    stroke-linecap="round"
/>

</svg>


</button>



<h2 id="rlTitle">
Login
</h2>


<div></div>


</div>


<!-- TAB -->

<div class="rl-tabs">


<button 
    id="loginTab"
    class="active"
    type="button"
>
Login
</button>


<button 
    id="registerTab"
    type="button"
>
Register
</button>


</div>



<!-- =========================
LOGIN
========================= -->


<div 
id="loginForm"
class="rl-form"
>



<!-- EMAIL -->

<div class="input-box">


<svg
class="input-icon"
viewBox="0 0 24 24"
>

<path d="M3 5h18v14H3z"/>

<path d="M3 7l9 6 9-6"/>

</svg>



<input
id="loginEmail"
type="email"
placeholder="Email"
>


</div>



<!-- PASSWORD -->

<div class="password-box">


<svg
class="input-icon"
viewBox="0 0 24 24"
>

<rect
x="5"
y="10"
width="14"
height="10"
rx="2"
/>

<path
d="M8 10V7a4 4 0 018 0v3"
/>


</svg>




<input
id="loginPassword"
type="password"
placeholder="Password"
>



<button
type="button"
class="toggle-password"
data-target="loginPassword"
>


<svg
class="eye-icon"
viewBox="0 0 24 24"
>

<path
d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"
/>

<circle
cx="12"
cy="12"
r="3"
/>

</svg>


</button>


</div>





<!-- ERROR -->

<div
id="loginError"
class="rl-error"
></div>





<button
id="loginSubmit"
class="rl-submit"
type="button"
disabled
>

Login

</button>


</div>






<!-- =========================
REGISTER
========================= -->


<div
id="registerForm"
class="rl-form hidden"
>




<!-- USERNAME -->

<div class="input-box">


<svg
class="input-icon"
viewBox="0 0 24 24"
>

<circle
cx="12"
cy="8"
r="4"
/>

<path
d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
/>

</svg>


<input
id="registerUsername"
type="text"
placeholder="Username"
>


</div>






<!-- EMAIL -->

<div class="input-box">


<svg
class="input-icon"
viewBox="0 0 24 24"
>

<path d="M3 5h18v14H3z"/>

<path d="M3 7l9 6 9-6"/>

</svg>


<input
id="registerEmail"
type="email"
placeholder="Email"
>


</div>







<!-- PASSWORD -->


<div class="password-box">


<svg
class="input-icon"
viewBox="0 0 24 24"
>

<rect
x="5"
y="10"
width="14"
height="10"
rx="2"
/>

<path
d="M8 10V7a4 4 0 018 0v3"
/>


</svg>



<input
id="registerPassword"
type="password"
placeholder="Password"
>



<button
type="button"
class="toggle-password"
data-target="registerPassword"
>


<svg
class="eye-icon"
viewBox="0 0 24 24"
>

<path
d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"
/>

<circle
cx="12"
cy="12"
r="3"
/>

</svg>


</button>


</div>








<!-- CONFIRM -->


<div class="password-box">


<svg
class="input-icon"
viewBox="0 0 24 24"
>

<rect
x="5"
y="10"
width="14"
height="10"
rx="2"
/>

<path
d="M8 10V7a4 4 0 018 0v3"
/>

</svg>




<input
id="registerConfirm"
type="password"
placeholder="Confirm Password"
>




<button
type="button"
class="toggle-password"
data-target="registerConfirm"
>


<svg
class="eye-icon"
viewBox="0 0 24 24"
>

<path
d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"
/>

<circle
cx="12"
cy="12"
r="3"
/>

</svg>


</button>


</div>







<!-- ERROR -->

<div
id="registerError"
class="rl-error"
></div>







<button
id="registerSubmit"
class="rl-submit"
type="button"
disabled
>

Register

</button>




</div>





</div>


</div>



<!-- ======== APPLICATION ======== -->
<!-- ======== APPLICATION ======== -->
<!-- ======== APPLICATION ======== -->

<main id="app">


<!-- ======== HOME ======== -->
<section
    id="homePage"
    class="page-section"
>

    <header id="home-header">
        <div class="home-brand">
            Unine
        </div>

        <div class="home-actions">
        

        <!-- Login Register -->

        <div
            class="home-auth"
            id="homeAuth"
        >
            <button id="loginButton">
                Login
            </button>

            <button id="registerButton">
                Register
            </button>
        </div>

        <!-- After Login -->
        <div
            id="userHeader"
            class="hidden"
        >
            <span
                id="headerUsername"
            ></span>

        </div>

    </div>
         
    </header>

    <!-- ======== ADVERTISE HEADER ======== -->

    <div id="advertise-header">
        <div class="advertise-track">
   
    </div>

    <!-- Telegram -->
    <a
        href="https://t.me/U9support"
        target="_blank"
        class="telegram-button"
        id="telegramButton"
    >
        <img
            src="icon/Telegram.svg"
            alt="Telegram"
        >
    </a>
    
</section>


<!-- ======== SHOP ======== -->

<section
    id="shopPage"
    class="page-section hidden"
>

    <h1>
        Shop
    </h1>

</section>


<!-- ======== ORDER ======== -->

<section
    id="orderPage"
    class="page-section hidden"
>


<div class="order-container">



    <!-- =====================
         USER ASSET
    ====================== -->


    <div class="order-top">


        <!-- Coins -->


        <div class="coins-box">


            <div class="coins-title">
                Coins
            </div>


            <div
                id="coinsDisplay"
                class="coins-value"
            >
                0
            </div>



            <button
                id="exchangeButton"
                type="button"
                class="exchange-button"
            >

                +

            </button>


        </div>





        <!-- Round -->


        <div class="round-box">


            <div class="round-title">
                Round
            </div>


            <div
                id="roundDisplay"
                class="round-value"
            >
                0/5
            </div>


        </div>



    </div>







    <!-- =====================
         ORDER STATUS
    ====================== -->


    <div
        id="orderStatus"
        class="order-status"
    >

        Ready

    </div>







    <!-- =====================
         MATCHING
    ====================== -->


    <div
        id="matchingBox"
        class="matching-box hidden"
    >


        Matching Product...


    </div>







    <!-- =====================
         PRODUCT
    ====================== -->


    <div
        id="productBox"
        class="product-box hidden"
    >



        <img
            id="productImage"
            src=""
            alt="Product"
        >



        <h3
            id="productName"
        >
        </h3>




        <div class="product-info">


            <p>

                Price:

                <span
                    id="orderPrice"
                >
                    0
                </span>

                Coins

            </p>




            <p>

                Profit:

                <span
                    id="orderProfit"
                >
                    0
                </span>

                Coins

            </p>


        </div>




    </div>







    <!-- =====================
         START ORDER
    ====================== -->


    <button
        id="startOrderButton"
        class="order-start-button"
        type="button"
    >

        Start Order

    </button>








    <!-- =====================
         COMPLETE ORDER
    ====================== -->


    <button
        id="completeOrderButton"
        class="order-complete-button"
        type="button"
        disabled
    >

        Complete Order

    </button>




</div>


</section>

<!-- ======== INBOX ======== -->

<section
    id="inboxPage"
    class="page-section hidden"
>

    <h1>
        Inbox
    </h1>

</section>


<!-- ======== ME ======== -->

<section
    id="mePage"
    class="page-section hidden"
>

    <div class="me-container">

        <h1>
            Me
        </h1>


        <!-- LOGOUT BUTTON -->

        <button
            id="logoutButton"
            type="button"
        >
            Logout
        </button>


    </div>




    <!-- LOGOUT CONFIRM MODAL -->

    <div
        id="logoutModal"
        class="logout-modal hidden"
    >

        <div class="logout-box">


            <h3>
                Confirm Logout?
            </h3>



            <div class="logout-actions">


                <button
                    id="logoutConfirm"
                    type="button"
                >
                    Confirm
                </button>



                <button
                    id="logoutCancel"
                    type="button"
                >
                    Cancel
                </button>


            </div>


        </div>

    </div>




</section>


</main>

<!-- ======== Menu-button ======== -->
<!-- ======== 底部菜单 ======== -->
<!-- ======== Menu-button ======== -->

<nav id="Menu-button">
    <!-- HOME -->
    <button id="homeButton" class="nav-button active" data-page="homePage"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V20.5h13V9.5"/><path d="M9 20.5v-6h6v6"/></svg><span>Home</span></button>
    <!-- SHOP -->
    <button id="shopButton" class="nav-button" data-page="shopPage"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h2l2.3 11a2 2 0 0 0 2 1.6h6.9a2 2 0 0 0 1.9-1.5L21 8H6.5"/><path d="M9 20a1 1 0 1 0 0 .01"/><path d="M17.5 20a1 1 0 1 0 0 .01"/></svg><span>Shop</span></button>
    <!-- ORDER -->
    <div id="orderArea"><div id="orderNotch"></div><button id="orderButton" class="nav-button" data-page="orderPage"><img src="icon/order.svg" alt="Order"><span>Order</span></button></div>
    <!-- INBOX -->
    <button id="inboxButton" class="nav-button" data-page="inboxPage"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 13h4l2 3h4l2-3h4"/></svg><span>Inbox</span></button>
    <!-- ME -->
    <button id="meButton" class="nav-button" data-page="mePage"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg><span>Me</span></button>
</nav>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
>

</body>

</html>
