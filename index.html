<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Unine"
    >

    <title>Unine</title>

    <link
        rel="stylesheet"
        href="index.css"
    >

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="site-header">

    <div class="header-container">


        <!-- LOGO -->

        <a
            href="index.html"
            class="logo"
        >
            Unine
        </a>


        <!-- AUTH AREA -->

        <div class="auth-area">


            <!-- LOGGED OUT -->

            <div
                id="loggedOutActions"
                class="logged-out-actions"
            >

                <button
                    type="button"
                    id="loginButton"
                    class="header-button login-button"
                >
                    Login
                </button>


                <button
                    type="button"
                    id="registerButton"
                    class="header-button register-button"
                >
                    Register
                </button>

            </div>


            <!-- LOGGED IN -->

            <div
                id="loggedInActions"
                class="logged-in-actions hidden"
            >

                <span
                    id="headerUsername"
                    class="user-name"
                >
                    User
                </span>


                <button
                    type="button"
                    id="logoutButton"
                    class="header-button logout-button"
                >
                    Logout
                </button>

            </div>

        </div>

    </div>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="main-content">


    <section class="hero-section">

        <div class="hero-content">

            <div class="hero-label">
                WELCOME
            </div>


            <h1>
                Unine
            </h1>


            <p class="hero-description">
                Welcome to Unine.
            </p>


            <!-- USER WELCOME -->

            <div
                id="welcomeUser"
                class="welcome-user hidden"
            >

                Welcome,
                <span id="welcomeUsername"></span>

            </div>

        </div>

    </section>

</main>



<!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav
    class="bottom-navigation"
    aria-label="Main navigation"
>


    <!-- HOME -->

    <a
        href="home/home/home.html"
        class="nav-item"
        data-page="home"
    >

        <span class="nav-icon">
            🏠
        </span>

        <span class="nav-label">
            Home
        </span>

    </a>



    <!-- SHOP -->

    <a
        href="shop/shop/shop.html"
        class="nav-item"
        data-page="shop"
    >

        <span class="nav-icon">
            🛒
        </span>

        <span class="nav-label">
            Shop
        </span>

    </a>



    <!-- ORDER -->

    <a
        href="order/order/order.html"
        class="nav-item"
        data-page="order"
    >

        <span class="nav-icon">
            📦
        </span>

        <span class="nav-label">
            Order
        </span>

    </a>



    <!-- INBOX -->

    <a
        href="inbox/inbox/inbox.html"
        class="nav-item"
        data-page="inbox"
    >

        <span class="nav-icon">
            💬
        </span>

        <span class="nav-label">
            Inbox
        </span>

    </a>



    <!-- ME -->

    <a
        href="me/me/me.html"
        class="nav-item"
        data-page="me"
    >

        <span class="nav-icon">
            👤
        </span>

        <span class="nav-label">
            Me
        </span>

    </a>

</nav>



<!-- =========================================
     LOGIN MODAL
========================================= -->

<div
    id="loginModal"
    class="modal hidden"
    aria-hidden="true"
>

    <div
        class="modal-overlay"
        data-close-modal
    ></div>


    <div class="modal-content">


        <button
            type="button"
            id="closeLoginModal"
            class="modal-close"
            aria-label="Close"
        >
            ×
        </button>


        <h2>
            Login
        </h2>


        <p class="modal-description">
            Login to your Unine account.
        </p>


        <form id="loginForm">


            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <div class="forgot-password">

                <a
                    href="forgot-password/forgot-password.html"
                >
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                id="loginSubmit"
                class="primary-button"
            >
                Login
            </button>


            <div
                id="loginMessage"
                class="form-message"
                aria-live="polite"
            ></div>

        </form>

    </div>

</div>



<!-- =========================================
     REGISTER MODAL
========================================= -->

<div
    id="registerModal"
    class="modal hidden"
    aria-hidden="true"
>

    <div
        class="modal-overlay"
        data-close-modal
    ></div>


    <div class="modal-content">


        <button
            type="button"
            id="closeRegisterModal"
            class="modal-close"
            aria-label="Close"
        >
            ×
        </button>


        <h2>
            Create Account
        </h2>


        <p class="modal-description">
            Create your Unine account.
        </p>


        <form id="registerForm">


            <div class="form-group">

                <label for="registerUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    name="username"
                    minlength="3"
                    maxlength="30"
                    autocomplete="username"
                    required
                >

                <small>
                    3-30 letters, numbers or underscores.
                </small>

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPasswordConfirm">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="registerPasswordConfirm"
                    name="password_confirm"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerSubmit"
                class="primary-button"
            >
                Create Account
            </button>


            <div
                id="registerMessage"
                class="form-message"
                aria-live="polite"
            ></div>

        </form>

    </div>

</div>



<!-- =========================================
     SUPABASE
========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="index.js"
    defer
></script>


</body>

</html>
