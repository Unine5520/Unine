<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">


<meta 
name="viewport" 
content="width=device-width, initial-scale=1.0"
>


<meta 
name="description" 
content="Unine"
>


<title>
Unine
</title>



<!-- GLOBAL CSS -->

<link 
rel="stylesheet" 
href="index.css"
>




<!-- PAGE CSS -->

<link 
rel="stylesheet" 
href="home/home/home.css"
>


<link 
rel="stylesheet" 
href="shop/shop/shop.css"
>


<link 
rel="stylesheet" 
href="order/order/order.css"
>


<link 
rel="stylesheet" 
href="inbox/inbox/inbox.css"
>


<link 
rel="stylesheet" 
href="me/me/me.css"
>


<link 
rel="stylesheet" 
href="me/setting/setting.css"
>


</head>




<body>





<!-- =================================
HEADER
================================= -->


<header 
id="siteHeader"
class="site-header"
>



<div class="header-container">



<div class="logo">

Unine

</div>





<div class="auth-area">






<!-- =====================
NOT LOGIN
===================== -->


<div
id="loggedOutActions"
class="auth-buttons"
>



<button

type="button"

id="loginButton"

class="header-button login-button"

>

Login

</button>





<button

type="button"

id="registerButton"

class="header-button register-button"

>

Register

</button>



</div>







<!-- =====================
LOGIN USER
===================== -->


<div

id="loggedInActions"

class="auth-buttons hidden"

>


<span

id="headerUsername"

class="username"

>

User

</span>



</div>







</div>


</div>


</header>







<!-- =================================
APPLICATION
================================= -->


<main id="app">





<!-- HOME -->


<section

id="homePage"

class="page-section"

>


<h1>

Home

</h1>


</section>







<!-- SHOP -->


<section

id="shopPage"

class="page-section hidden"

>


<h1>

Shop

</h1>


</section>







<!-- ORDER -->


<section

id="orderPage"

class="page-section hidden"

>


<h1>

Order

</h1>


</section>







<!-- INBOX -->


<section

id="inboxPage"

class="page-section hidden"

>


<h1>

Inbox

</h1>


</section>







<!-- ME -->


<section

id="mePage"

class="page-section hidden"

>



</section>






</main>







<!-- =================================
BOTTOM NAVIGATION
================================= -->


<nav
class="bottom-navigation"
>




<button
type="button"
class="nav-item active"
data-page="home"
>


<span class="nav-icon">

🏠

</span>


<span class="nav-label">

Home

</span>


</button>






<button
type="button"
class="nav-item"
data-page="shop"
>


<span class="nav-icon">

🛒

</span>


<span class="nav-label">

Shop

</span>


</button>






<button
type="button"
class="nav-item protected"
data-page="order"
>


<span class="nav-icon">

📦

</span>


<span class="nav-label">

Order

</span>


</button>






<button
type="button"
class="nav-item protected"
data-page="inbox"
>


<span class="nav-icon">

💬

</span>


<span class="nav-label">

Inbox

</span>


</button>






<button
type="button"
class="nav-item protected"
data-page="me"
>


<span class="nav-icon">

👤

</span>


<span class="nav-label">

Me

</span>


</button>




</nav>









<!-- =================================
LOGIN MODAL
================================= -->


<div

id="loginModal"

class="modal hidden"

aria-hidden="true"

>



<div

class="modal-background"

data-close-modal

></div>






<div class="modal-box">





<button

type="button"

id="closeLoginModal"

class="close-button"

>

×

</button>







<h2>

Login

</h2>







<p>

Login to your Unine account.

</p>








<form id="loginForm">







<div class="input-group">



<label for="loginEmail">

Email

</label>



<input

type="email"

id="loginEmail"

name="email"

autocomplete="email"

required

>



</div>







<!-- PASSWORD -->

<div class="input-group">



<label for="loginPassword">

Password

</label>




<div class="password-wrapper">



<input

type="password"

id="loginPassword"

name="password"

autocomplete="current-password"

required

>




<button

type="button"

class="password-toggle"

data-target="loginPassword"

>



<img

src="https://airkbwolmkidaokqhxjj.supabase.co/storage/v1/object/public/Photos/Inbox.png"

alt="show password"

>



</button>




</div>



</div>








<div class="forgot-password">


<a

href="forgot-password/forgot-password.html"

>

Forgot password?

</a>


</div>









<button

type="submit"

id="loginSubmit"

class="primary-button"

>


Login


</button>








<div

id="loginMessage"

class="form-message"

aria-live="polite"

>

</div>







</form>







</div>



</div>

  <!-- =================================
REGISTER MODAL
================================= -->


<div

id="registerModal"

class="modal hidden"

aria-hidden="true"

>



<div

class="modal-background"

data-close-modal

></div>







<div class="modal-box">





<button

type="button"

id="closeRegisterModal"

class="close-button"

>

×

</button>







<h2>

Create Account

</h2>







<p>

Join Unine.

</p>








<form id="registerForm">







<!-- USERNAME -->

<div class="input-group">



<label for="registerUsername">

Username

</label>



<input

type="text"

id="registerUsername"

name="username"

minlength="3"

maxlength="30"

autocomplete="username"

required

>



</div>







<!-- EMAIL -->

<div class="input-group">



<label for="registerEmail">

Email

</label>



<input

type="email"

id="registerEmail"

name="email"

autocomplete="email"

required

>



</div>







<!-- PASSWORD -->

<div class="input-group">



<label for="registerPassword">

Password

</label>




<div class="password-wrapper">



<input

type="password"

id="registerPassword"

name="password"

minlength="8"

autocomplete="new-password"

required

>





<button

type="button"

class="password-toggle"

data-target="registerPassword"

>



<img

src="https://airkbwolmkidaokqhxjj.supabase.co/storage/v1/object/public/Photos/Inbox.png"

alt="show password"

>



</button>




</div>



</div>









<!-- CONFIRM PASSWORD -->

<div class="input-group">



<label for="registerPasswordConfirm">

Confirm Password

</label>




<div class="password-wrapper">



<input

type="password"

id="registerPasswordConfirm"

name="password_confirm"

minlength="8"

autocomplete="new-password"

required

>





<button

type="button"

class="password-toggle"

data-target="registerPasswordConfirm"

>



<img

src="https://airkbwolmkidaokqhxjj.supabase.co/storage/v1/object/public/Photos/Inbox.png"

alt="show password"

>



</button>




</div>



</div>








<button

type="submit"

id="registerSubmit"

class="primary-button"

>


Create Account


</button>








<div

id="registerMessage"

class="form-message"

aria-live="polite"

>

</div>








</form>






</div>



</div>









<!-- =================================
SUPABASE
================================= -->


<script

src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">

</script>







<!-- CORE -->


<script

src="index.js">

</script>








<!-- PAGE JS -->


<script

src="home/home/home.js">

</script>




<script

src="shop/shop/shop.js">

</script>




<script

src="order/order/order.js">

</script>




<script

src="inbox/inbox/inbox.js">

</script>




<script

src="me/me/me.js">

</script>







</body>


</html>
