<body>

<!-- ======== RL MODAL ======== -->
<!-- ======== RL MODAL ======== -->
<!-- ======== RL MODAL ======== -->

<div id="rlModal" class="rl-modal hidden">

    <div class="rl-box">

        <div class="rl-header">

            <button id="rlClose">
                ←
            </button>

            <h2 id="rlTitle">
                Login
            </h2>

            <div></div>

        </div>


        <div class="rl-tabs">

            <button 
                id="loginTab"
                class="active"
            >
                Login
            </button>

            <button id="registerTab">
                Register
            </button>

        </div>


        <!-- LOGIN -->

        <div id="loginForm" class="rl-form">


            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
            >


            <div class="password-box">

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="loginPassword"
                >
                    👁
                </button>

            </div>


            <button
                id="loginSubmit"
                class="rl-submit"
            >
                Login
            </button>


        </div>



        <!-- REGISTER -->

        <div
            id="registerForm"
            class="rl-form hidden"
        >


            <input
                id="registerUsername"
                type="text"
                placeholder="Username"
            >


            <input
                id="registerEmail"
                type="email"
                placeholder="Email"
            >



            <div class="password-box">

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="registerPassword"
                >
                    👁
                </button>

            </div>



            <div class="password-box">

                <input
                    id="registerConfirm"
                    type="password"
                    placeholder="Confirm Password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="registerConfirm"
                >
                    👁
                </button>

            </div>



            <button
                id="registerSubmit"
                class="rl-submit"
            >
                Register
            </button>


        </div>


    </div>

</div>
    
<!-- ======== APPLICATION ======== -->
<!-- ======== APPLICATION ======== -->
<!-- ======== APPLICATION ======== -->

<main id="app">


<!-- ======== HOME ======== -->
<section
    id="homePage"
    class="page-section"
>

    <header id="home-header">
        <div class="home-brand">
            Unine
        </div>

        <div class="home-actions">
        

        <!-- Login Register -->

        <div
            class="home-auth"
            id="homeAuth"
        >
            <button id="loginButton">
                Login
            </button>

            <button id="registerButton">
                Register
            </button>
        </div>

        <!-- After Login -->
        <div
            id="userHeader"
            class="hidden"
        >
            <span
                id="headerUsername"
            ></span>

        </div>

    </div>
         
    </header>

    <!-- Telegram -->
    <a
        href="https://t.me/U9support"
        target="_blank"
        class="telegram-button"
        id="telegramButton"
    >
        <img
            src="icon/Telegram.svg"
            alt="Telegram"
        >
    </a>
    

    <!-- ======== test ======== -->

    <div class="home-test-content">

        <h1>Home Test</h1>

        <p>Scroll down to test the fixed header.</p>

        <div class="test-box">Test Content 01</div>
        <div class="test-box">Test Content 02</div>
        <div class="test-box">Test Content 03</div>
        <div class="test-box">Test Content 04</div>
        <div class="test-box">Test Content 05</div>
        <div class="test-box">Test Content 06</div>
        <div class="test-box">Test Content 07</div>
        <div class="test-box">Test Content 08</div>

    </div>

    <!-- ======== test ======== -->


</section>


<!-- ======== SHOP ======== -->

<section

    class="page-section hidden"
>

        Shop
    </h1>

</section>


<!-- ======== ORDER ======== -->

<section

    class="page-section hidden"
>

    <h1>

    </h1>

</section>


<!-- ======== INBOX ======== -->

</section>


<!-- ======== ME ======== -->

<section
    id="mePage"
    class="page-section hidden"
>

    <div class="me-container">

        <h1>
            Me
        </h1>

    </div>

    <div class="me-user">
         <span>
             Username:
         </span>

         <span id="meUsername">
         </span>

    </div>

    <button
        id="logoutButton"
        class="logout-button"
    >
        Logout
    </button>

    <!-- LOGOUT CONFIRM MODAL -->

    <div
        id="logoutModal"
        class="logout-modal hidden"
    >
        <div class="logout-box">
            
            <h3>
                Confirm Logout?
            </h3>

            <div class="logout-actions">

                <button
                    id="logoutConfirm"
                >
                    Confirm
                </button>

                <button
                    id="logoutCancel"
                >
                    Cancel
                </button>
            </div>
        </div>
</div>




</section>
