  <!-- =========================
      REGISTER MODAL
  ========================= -->
  <div id="U9-register-modal">

    <div id="U9-register-modal-content">

      <button id="U9-register-modal-close">
        ×
      </button>

      <h2>Register</h2>

      <form id="U9-register-form">

        <label for="U9-register-username">
          Username
        </label>

        <input
          type="text"
          id="U9-register-username"
          name="username"
          autocomplete="username"
          required
        >


        <label for="U9-register-email">
          Email
        </label>

        <input
          type="email"
          id="U9-register-email"
          name="email"
          autocomplete="email"
          required
        >


        <label for="U9-register-password">
          Password
        </label>

        <div id="U9-register-password-wrapper">

          <input
            type="password"
            id="U9-register-password"
            name="password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            id="U9-register-password-toggle"
          >
            Show
          </button>

        </div>


        <label for="U9-register-confirm-password">
          Confirm Password
        </label>

        <div id="U9-register-confirm-password-wrapper">

          <input
            type="password"
            id="U9-register-confirm-password"
            name="confirm-password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            id="U9-register-confirm-password-toggle"
          >
            Show
          </button>

        </div>


        <button
          type="submit"
          id="U9-register-submit"
        >
          Register
        </button>

      </form>

    </div>

  </div>

        <label for="U9-login-password">

            required

          <button

        </div>


        <button

      </form>
