<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Unine Auth Test
</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin:0;

    padding:30px;

    font-family:
        Arial,
        sans-serif;

    background:#f5f5f5;

    color:#222;

}


.container {

    max-width:900px;

    margin:0 auto;

}


h1 {

    margin-bottom:10px;

}


.status {

    padding:15px;

    margin-bottom:20px;

    background:#fff;

    border-radius:10px;

    border:1px solid #ddd;

}


.section {

    background:#fff;

    padding:20px;

    margin-bottom:20px;

    border-radius:10px;

    border:1px solid #ddd;

}


h2 {

    margin-top:0;

}


input {

    width:100%;

    padding:12px;

    margin-bottom:10px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:15px;

}


button {

    padding:11px 18px;

    margin:4px 4px 4px 0;

    border:none;

    border-radius:6px;

    cursor:pointer;

    font-size:14px;

}


button:hover {

    opacity:.85;

}


.result {

    margin-top:15px;

    padding:15px;

    background:#111;

    color:#fff;

    border-radius:8px;

    white-space:pre-wrap;

    word-break:break-word;

    font-family:monospace;

    font-size:13px;

    min-height:60px;

}


.user-info {

    display:none;

    margin-top:15px;

    padding:15px;

    background:#f0f7ff;

    border-radius:8px;

}


.user-info div {

    margin:6px 0;

}


.label {

    font-weight:bold;

}


</style>


</head>



<body>


<div class="container">


<h1>
    Unine Auth Test
</h1>


<div class="status">

<strong>
    Auth Status:
</strong>

<span id="authStatus">
    Checking...
</span>

</div>




<!-- ===========================
     REGISTER
=========================== -->


<div class="section">


<h2>
    Register
</h2>


<input
    id="registerUsername"
    type="text"
    placeholder="Username"
    autocomplete="username"
>


<input
    id="registerEmail"
    type="email"
    placeholder="Email"
    autocomplete="email"
>


<input
    id="registerPassword"
    type="password"
    placeholder="Password"
    autocomplete="new-password"
>


<button onclick="registerUser()">

Register

</button>


<div
    id="registerResult"
    class="result"
>

Waiting...

</div>


</div>





<!-- ===========================
     LOGIN
=========================== -->


<div class="section">


<h2>
    Login
</h2>


<input
    id="login"
    type="text"
    placeholder="Username or Email"
    autocomplete="username"
>


<input
    id="loginPassword"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
>


<button onclick="loginUser()">

Login

</button>


<div
    id="loginResult"
    class="result"
>

Waiting...

</div>


</div>






<!-- ===========================
     CURRENT SESSION
=========================== -->


<div class="section">


<h2>
    Current Session
</h2>


<button onclick="getMe()">

Check Me

</button>



<div
id="userInfo"
class="user-info"
>


<div>

<span class="label">
ID:
</span>

<span id="userId"></span>

</div>



<div>

<span class="label">
Username:
</span>

<span id="userUsername"></span>

</div>



<div>

<span class="label">
Email:
</span>

<span id="userEmail"></span>

</div>



<div>

<span class="label">
Coins:
</span>

<span id="userCoins"></span>

</div>



<div>

<span class="label">
Balance:
</span>

<span id="userBalance"></span>

</div>



<div>

<span class="label">
Status:
</span>

<span id="userStatus"></span>

</div>



<div>

<span class="label">
Created:
</span>

<span id="userCreated"></span>

</div>



</div>



<div
id="meResult"
class="result"
>

Waiting...

</div>


</div>





<!-- ===========================
     CHANGE PASSWORD
=========================== -->


<div class="section">


<h2>
    Change Password
</h2>



<input
    id="oldPassword"
    type="password"
    placeholder="Old Password"
    autocomplete="current-password"
>



<input
    id="newPassword"
    type="password"
    placeholder="New Password"
    autocomplete="new-password"
>



<input
    id="confirmPassword"
    type="password"
    placeholder="Confirm New Password"
    autocomplete="new-password"
>



<button onclick="changePassword()">

Change Password

</button>



<div
id="changePasswordResult"
class="result"
>

Waiting...

</div>



</div>

<script>


/* =========================================
   SUPABASE EDGE FUNCTION CONFIG
========================================= */


const API_BASE =

"https://layzcgktgtrqvsgxwwyc.supabase.co/functions/v1";





/* =========================================
   API REQUEST
========================================= */


async function apiRequest(

    endpoint,

    options = {}

){


    const url =

        API_BASE + endpoint;



    const defaultOptions = {


        credentials:

            "include",


        headers:{


            "Content-Type":

                "application/json"


        }


    };



    const finalOptions = {


        ...defaultOptions,


        ...options,


        headers:{


            ...defaultOptions.headers,


            ...(options.headers || {})


        }


    };



    console.log(

        "API Request:",

        url,

        finalOptions

    );



    const response =

        await fetch(

            url,

            finalOptions

        );




    let data;



    try{


        data =

            await response.json();


    }

    catch{


        data = {


            success:false,


            error:

                "Invalid JSON response"


        };


    }




    document.getElementById(

        "rawResult"

    ).textContent =


        JSON.stringify(

            {

                http_status:

                    response.status,


                response:

                    data


            },


            null,

            2

        );





    return {


        response,


        data


    };


}







/* =========================================
   REGISTER
========================================= */


async function registerUser(){



const username =

document.getElementById(

"registerUsername"

).value.trim();




const email =

document.getElementById(

"registerEmail"

).value.trim();




const password =

document.getElementById(

"registerPassword"

).value;




const result =

document.getElementById(

"registerResult"

);




result.textContent =

"Registering...";





if(

!username ||

!email ||

!password

){


result.textContent =

"Please fill all fields.";


return;


}





try{


const {

response,

data

}=

await apiRequest(

"/register",

{


method:"POST",


body:

JSON.stringify({

username,

email,

password

})


}

);





result.textContent =

JSON.stringify(

data,

null,

2

);





if(

response.ok &&

data.success

){


await getMe();


}



}

catch(error){



console.error(

"Register error:",

error

);



result.textContent =

"Network error: "

+

error.message;



}


}









/* =========================================
   LOGIN
========================================= */


async function loginUser(){



const login =

document.getElementById(

"login"

).value.trim();




const password =

document.getElementById(

"loginPassword"

).value;




const result =

document.getElementById(

"loginResult"

);




result.textContent =

"Logging in...";





if(

!login ||

!password

){


result.textContent =

"Enter username/email and password.";


return;


}







try{


const {

response,

data

}=


await apiRequest(

"/login",

{


method:"POST",


body:

JSON.stringify({

login,

password

})


}

);






result.textContent =

JSON.stringify(

data,

null,

2

);






if(

response.ok &&

data.success

){


await getMe();


}



}


catch(error){



console.error(

"Login error:",

error

);



result.textContent =

"Network error: "

+

error.message;



}



}









/* =========================================
   GET ME
========================================= */


async function getMe(){



const result =

document.getElementById(

"meResult"

);




result.textContent =

"Checking session...";






try{



const {

response,

data

}=


await apiRequest(

"/me",

{


method:"GET"


}

);






result.textContent =

JSON.stringify(

data,

null,

2

);






updateUserInterface(

data

);




return data;



}



catch(error){



console.error(

"Me error:",

error

);



result.textContent =

"Network error: "

+

error.message;



updateUserInterface({

success:false,

logged_in:false

});




return null;



}



}









/* =========================================
   UPDATE USER INTERFACE
========================================= */


function updateUserInterface(

data

){



const status =

document.getElementById(

"authStatus"

);



const userInfo =

document.getElementById(

"userInfo"

);







if(

data &&

data.success &&

data.logged_in &&

data.user

){



const user =

data.user;





status.textContent =

"LOGGED IN";




userInfo.style.display =

"block";






document.getElementById(

"userId"

).textContent =

user.id ?? "";





document.getElementById(

"userUsername"

).textContent =

user.username ?? "";





document.getElementById(

"userEmail"

).textContent =

user.email ?? "";





document.getElementById(

"userCoins"

).textContent =

user.coins ?? "0";





document.getElementById(

"userBalance"

).textContent =

user.balance ?? "0";





document.getElementById(

"userStatus"

).textContent =

user.status ?? "";





document.getElementById(

"userCreated"

).textContent =

user.created_at ?? "";




}



else{



status.textContent =

"NOT LOGGED IN";



userInfo.style.display =

"none";



}



}






/* =========================================
   LOGOUT
========================================= */


async function logoutUser(){



const result =

document.getElementById(

"logoutResult"

);




result.textContent =

"Logging out...";






try{



const {

data

}=


await apiRequest(

"/logout",

{


method:"POST"


}

);





result.textContent =

JSON.stringify(

data,

null,

2

);





await getMe();




}


catch(error){



console.error(

"Logout error:",

error

);



result.textContent =

"Network error: "

+

error.message;



}



}









/* =========================================
   CHANGE PASSWORD
========================================= */


async function changePassword(){



const oldPassword =

document.getElementById(

"oldPassword"

).value;





const newPassword =

document.getElementById(

"newPassword"

).value;





const confirmPassword =

document.getElementById(

"confirmPassword"

).value;





const result =

document.getElementById(

"changePasswordResult"

);







if(

!oldPassword ||

!newPassword ||

!confirmPassword

){



result.textContent =

"Please fill all fields.";


return;


}







if(

newPassword !== confirmPassword

){



result.textContent =

"New passwords do not match.";


return;


}







if(

newPassword.length < 8

){



result.textContent =

"Password must be at least 8 characters.";


return;


}






result.textContent =

"Changing password...";







try{



const {

response,

data

}=


await apiRequest(

"/change-password",

{


method:"POST",


body:

JSON.stringify({

old_password:

oldPassword,


new_password:

newPassword


})


}

);






result.textContent =

JSON.stringify(

data,

null,

2

);






if(

response.ok &&

data.success

){



document.getElementById(

"oldPassword"

).value = "";



document.getElementById(

"newPassword"

).value = "";



document.getElementById(

"confirmPassword"

).value = "";



}



}



catch(error){



console.error(

"Change password error:",

error

);



result.textContent =

"Network error: "

+

error.message;



}



}









/* =========================================
   INITIAL SESSION CHECK
========================================= */


document.addEventListener(

"DOMContentLoaded",

()=>{


getMe();


}

);



</script>


</body>

</html>
