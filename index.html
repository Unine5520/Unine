<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta name="description" content="Unine">


<title>
Unine
</title>


<link rel="stylesheet" href="index.css">


</head>


<body>


<!-- ================================
     HEADER
================================ -->


<header class="site-header">


<div class="header-container">


<div class="logo">

Unine

</div>



<div class="auth-area">



<!-- NOT LOGIN -->

<div 
id="loggedOutActions"
class="auth-buttons"
>


<button
id="loginButton"
class="header-button login-button"
>

Login

</button>



<button
id="registerButton"
class="header-button register-button"
>

Register

</button>


</div>





<!-- LOGIN -->

<div
id="loggedInActions"
class="auth-buttons hidden"
>


<span
id="headerUsername"
class="username"
>
User
</span>



<button
id="logoutButton"
class="header-button logout-button"
>

Logout

</button>


</div>



</div>



</div>


</header>





<!-- ================================
     APPLICATION CONTENT
================================ -->


<main id="app">


<!-- HOME DEFAULT -->


<section
id="homePage"
class="page-section"
>


<h1>
Welcome to Unine
</h1>


<p>
Your global platform
</p>



<div
id="welcomeUser"
class="welcome-user hidden"
>


Welcome,

<span id="welcomeUsername"></span>


</div>


</section>



</main>







<!-- ================================
     BOTTOM NAVIGATION
================================ -->



<nav class="bottom-navigation">


<button
class="nav-item active"
data-page="home"
>


<span>
🏠
</span>


<label>
Home
</label>


</button>





<button
class="nav-item"
data-page="shop"
>


<span>
🛒
</span>


<label>
Shop
</label>


</button>






<button
class="nav-item protected"
data-page="order"
>


<span>
📦
</span>


<label>
Order
</label>


</button>





<button
class="nav-item protected"
data-page="inbox"
>


<span>
💬
</span>


<label>
Inbox
</label>


</button>






<button
class="nav-item protected"
data-page="me"
>


<span>
👤
</span>


<label>
Me
</label>


</button>




</nav>







<!-- ================================
     LOGIN MODAL
================================ -->


<div
id="loginModal"
class="modal hidden"
>



<div
class="modal-background"
data-close-modal
></div>





<div class="modal-box">



<button
id="closeLoginModal"
class="close-button"
>

×

</button>



<h2>
Login
</h2>



<p>
Login to your Unine account
</p>





<form id="loginForm">



<div class="input-group">


<label>
Email
</label>


<input

type="email"

id="loginEmail"

name="email"

autocomplete="email"

required

>


</div>






<div class="input-group">


<label>
Password
</label>


<input

type="password"

id="loginPassword"

name="password"

autocomplete="current-password"

required

>


</div>






<div class="forgot-password">


<a href="forgot-password/forgot-password.html">

Forgot password?

</a>


</div>







<button
id="loginSubmit"
class="primary-button"
>


Login


</button>






<div
id="loginMessage"
class="form-message"
>

</div>





</form>




</div>


</div>









<!-- ================================
     REGISTER MODAL
================================ -->



<div
id="registerModal"
class="modal hidden"
>



<div
class="modal-background"
data-close-modal
></div>





<div class="modal-box">



<button
id="closeRegisterModal"
class="close-button"
>

×

</button>




<h2>
Create Account
</h2>



<p>
Join Unine
</p>





<form id="registerForm">






<div class="input-group">


<label>
Username
</label>


<input

type="text"

id="registerUsername"

name="username"

minlength="3"

maxlength="30"

required

>


</div>






<div class="input-group">


<label>
Email
</label>


<input

type="email"

id="registerEmail"

name="email"

required

>


</div>







<div class="input-group">


<label>
Password
</label>


<input

type="password"

id="registerPassword"

name="password"

minlength="8"

required

>


</div>








<div class="input-group">


<label>
Confirm Password
</label>


<input

type="password"

id="registerPasswordConfirm"

name="password_confirm"

minlength="8"

required

>


</div>






<button

id="registerSubmit"

class="primary-button"

>


Create Account


</button>







<div

id="registerMessage"

class="form-message"

>


</div>






</form>




</div>


</div>









<!-- ================================
     SUPABASE
================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script src="index.js"></script>



</body>

</html>
