  <!-- CSS -->
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="CSS/HEADER/header.css">
  <link rel="stylesheet" href="CSS/ACCOUNT/account-register-modal.css">
  <link rel="stylesheet" href="CSS/ACCOUNT/account-login-modal.css">
  <link rel="stylesheet" href="CSS/ACCOUNT/account-logout-modal.css">

<body>

  <!-- =========== HEADER =========== -->
  <!-- =========== HEADER =========== -->
  <!-- =========== HEADER =========== -->

  <header id="U9-page-header">
    <div id="U9-page-header-u9-logo">
      <!-- Unine-LOGO -->
      <div id="U9-page-header-u9-logo">
        <img
          src="SSVG/logo/uninelogo.svg"
          alt="Unine"
        >
      </div>
    </div>

    <div id="U9-page-header-actions">

      <button id="U9-page-header-register">
        Register
      </button>

      <button id="U9-page-header-login">
        Login
      </button>

      <button id="U9-page-header-user">

        <svg
          id="U9-page-header-user-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="8"
            r="4"
          />

          <path
            d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"
          />
        </svg>

        <span id="U9-page-header-username"></span>

      </button>

    </div>

  </header>

  <!-- ======= CONTAINER TOOL ======= -->
  <!-- ======= CONTAINER TOOL ======= -->

  <div id="U9-page-container-tool">

    <!-- NORMAL TOOL -->
    <!-- NORMAL TOOL -->
    <!-- NORMAL TOOL -->

    <div id="U9-page-container-tool-normal">

      <!-- MENU SVG -->
      <button id="U9-page-container-tool-menu" type="button">
        <img
          src="SSVG/button/menu.svg"
          alt=""
          aria-hidden="true"
        >
      </button>

      <!-- SEARCH SVG -->
      <div id="U9-page-container-tool-search">

        <input
          id="U9-page-container-tool-search-input"
          type="text"
          placeholder="Search..."
          autocomplete="off"
        >

        <button
          id="U9-page-container-tool-search-button"
          type="button"
        >
          <img
            src="SSVG/button/search.svg"
            alt=""
            aria-hidden="true"
          >
        </button>
  
      </div>

      <!-- MESSAGE -->
      <button id="U9-page-container-tool-message" type="button">
        <img
          src="SSVG/button/message.svg"
          alt=""
          aria-hidden="true"
        >
      </button>

      <!-- INBOX -->
      <button id="U9-page-container-tool-inbox" type="button">
        <img
          src="SSVG/button/inbox.svg"
          alt=""
          aria-hidden="true"
        >
      </button>

      <!-- GIFT -->
      <button id="U9-page-container-tool-gift" type="button">
        <img
          src="SSVG/button/gift.svg"
          alt=""
          aria-hidden="true"
        >
      </button>

      <!-- HISTORY -->
      <button id="U9-page-container-tool-history" type="button">
        <img
          src="SSVG/button/history.svg"
          alt=""
          aria-hidden="true"
        >
      </button>

    </div>

    <!-- PAGE MENU -->
    <!-- PAGE MENU -->
    <!-- PAGE MENU -->

    <div id="U9-page-container-tool-pages">

      <!-- NEW -->
      <button
        id="U9-page-container-tool-new"
        type="button"
        aria-label="New"
      >
        <img
          src="SSVG/button/new.svg"
          alt=""
        >
      </button>

      <button
        id="U9-page-container-tool-home"
        type="button"
      >
        Home
      </button>

      <button
        id="U9-page-container-tool-shop-page"
        type="button"
      >
        Shop
      </button>

      <button
        id="U9-page-container-tool-auction"
        type="button"
      >
        Auction
      </button>

      <button
        id="U9-page-container-tool-test1"
        type="button"
      >
        Test1
      </button>

      <button
        id="U9-page-container-tool-test2"
        type="button"
      >
        Test2
      </button>

    </div>
  </div>

  <!-- =========== PAGE NAME  =========== -->
  <!-- =========== PAGE NAME  =========== -->
  <!-- =========== PAGE NAME  =========== -->
  
  <div id="U9-page-pages">

    <!-- === HOME === -->
    <div id="U9-page-home">

      <!-- === ADVERTISE === -->
      <div id="U9-page-home-advertise">
      </div>

      <!-- === PORDUCT === -->
      <div id="U9-page-home-products">
      </div>

    </div>

    <!-- === SHOP  === -->
    <div id="U9-page-shop">
      Shop
    </div>

    <!-- === AUCTION  === -->
    <div id="U9-page-auction">
      Auction
    </div>

    <!-- === TEST-1  === -->
    <div id="U9-page-test1">
      Test1
    </div>

    <!-- === TEST-2  === -->

  <!-- ======== ALL MODAL  ======== -->

  <!-- =========================
      ACCOUNT SETTING
  ========================= -->

  <div id="U9-account-setting">

    <div id="U9-account-setting-content">

      <!-- =========== HEADER =========== -->

      <div id="U9-account-setting-header">

        <!-- ADD FRIEND HEADER -->

        <div
          id="Account-U9-account-add-friend-page-header"
        >

          <button
            id="Account-U9-account-add-friend-page-back"
            type="button"
            aria-label="Back"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M9 6L15 12L9 18"
              ></path>

            </svg>

          </button>

          <img
            id="Account-U9-account-add-friend-page-header-icon"
            src="SVG/add-friend-header.svg"
            alt="Add Friend"
          >

        </div>

        <!-- ACCOUNT HEADER -->

        <div
          id="Account-U9-account-header"
          class="active"
        >

          <button
            id="Account-U9-account-setting-back"
            type="button"
            aria-label="Close"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M6 6L18 18"
              ></path>

              <path
                d="M18 6L6 18"
              ></path>

            </svg>

          </button>

          <img
            src="SVG/account-header.svg"
            alt="Account"
          >

        </div>

        <!-- SETTING / EDIT HEADER -->

        <div
          id="Account-U9-account-setting-page-header"
        >

          <button
            id="Account-U9-account-setting-page-back"
            type="button"
            aria-label="Back"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M15 6L9 12L15 18"
              ></path>

            </svg>

          </button>

          <img
            id="Account-U9-account-setting-page-header-icon"
            src="SVG/setting-header.svg"
            alt="Setting"
          >

        </div>

      </div>

      <!-- =========== PAGES =========== -->

      <div
        id="Account-U9-account-setting-pages"
      >

        <!-- =========== ADD FRIEND PAGE =========== -->

        <div
          id="Account-U9-account-add-friend-page"
        >

        </div>

        <!-- =========== ACCOUNT PAGE =========== -->

        <div
          id="Account-U9-account-page"
        >

          <!-- =========== ACTIONS =========== -->

          <div
            id="Account-U9-account-actions"
          >

            <!-- ADD FRIEND -->

            <button
              id="Account-U9-account-add-friend"
              type="button"
              aria-label="Add Friend"
            >

              <img
                src="SSVG/account/add-friend-button.svg"
                alt=""
              >

            </button>

            <!-- RIGHT ACTIONS -->

            <div
              id="Account-U9-account-right-actions"
            >

              <!-- SETTING -->

              <button
                id="Account-U9-account-setting-button"
                type="button"
                aria-label="Setting"
              >

                <img
                  src="SSVG/account/account-setting-button.svg"
                  alt=""
                >

              </button>

              <!-- EDIT PROFILE -->

              <button
                id="Account-U9-account-edit-profile"
                type="button"
                aria-label="Edit Profile"
              >

                <img
                  src="SSVG/account/account-edit-button.svg"
                  alt=""
                >

              </button>

            </div>

          </div>

          <!-- =========== ACCOUNT PROFILE =========== -->

          <div
            id="Account-U9-account-profile"
          >

            <!-- AVATAR -->

            <div
              id="Account-U9-account-avatar"
            >

              <!-- AVATAR -->

              <img
                id="Account-U9-account-avatar-image"
                src="https://cdn.phototourl.com/member/2026-09-27-1820f3c5-27c3-4b52-a71b-4f994a631758.jpg"
                alt="Avatar"
              >

              <!-- FRAME -->

              <img
                id="Account-U9-account-avatar-frame"
                src=""
                alt=""
              >

            </div>

            <!-- USERNAME -->

            <div
              id="Account-U9-account-username"
            ></div>

            <!-- ACCOUNT -->

            <div
              id="Account-U9-account-account"
            ></div>

          </div>

          <!-- =========== FUTURE CONTENT =========== -->

          <div
            id="Account-U9-account-setting-future"
          >

          </div>

        </div>

        <!-- =========== SETTING PAGE =========== -->

        <div
          id="Account-U9-account-setting-page"
        >

          <!-- =========== LOGOUT =========== -->

          <button
            id="Account-U9-account-logout"
            type="button"
          >

            <img
              src="SSVG/account/account-setting-logout-button.svg"
              alt=""
            >

            <span>
              Logout
            </span>

          </button>

        </div>


        <!-- =========== EDIT PROFILE PAGE =========== -->

        <div
          id="Account-U9-account-edit-profile-page"
        >

        </div>

      </div>

    </div>

  </div>

  <!-- =========================
      REGISTER MODAL
  ========================= -->
  <div id="U9-register-modal">

    <div id="U9-register-modal-content">

      <button id="U9-register-modal-close">
        ×
      </button>

      <h2>Register</h2>

      <form id="U9-register-form">

        <label for="U9-register-username">
          Username
        </label>

        <input
          type="text"
          id="U9-register-username"
          name="username"
          autocomplete="username"
          required
        >

        <label for="U9-register-email">
          Email
        </label>

        <input
          type="email"
          id="U9-register-email"
          name="email"
          autocomplete="email"
          required
        >

        <label for="U9-register-password">
          Password
        </label>

        <div id="U9-register-password-wrapper">

          <input
            type="password"
            id="U9-register-password"
            name="password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            id="U9-register-password-toggle"
          >
            Show
          </button>

        </div>


        <label for="U9-register-confirm-password">
          Confirm Password
        </label>

        <div id="U9-register-confirm-password-wrapper">

          <input
            type="password"
            id="U9-register-confirm-password"
            name="confirm-password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            id="U9-register-confirm-password-toggle"
          >
            Show
          </button>

        </div>


        <button
          type="submit"
          id="U9-register-submit"
        >
          Register
        </button>

      </form>

    </div>

  </div>

  <!-- =========================
      LOGIN MODAL
  ========================= -->
  <div id="U9-login-modal">

    <div id="U9-login-modal-content">

      <button id="U9-login-modal-close">
        ×
      </button>

      <h2>Login</h2>

      <form id="U9-login-form">

        <label for="U9-login-email">
          Email
        </label>

        <input
          type="email"
          id="U9-login-email"
          name="email"
          autocomplete="email"
          required
        >

        <label for="U9-login-password">
          Password
        </label>

        <div id="U9-login-password-wrapper">

          <input
            type="password"
            id="U9-login-password"
            name="password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            id="U9-login-password-toggle"
          >
            Show
          </button>

        </div>

        <button
          type="submit"
          id="U9-login-submit"
        >
          Login
        </button>

      </form>

    </div>

  </div>

  <!-- =========================
      LOGOUT CONFIRM
  ========================= -->
  <div id="U9-account-logout">

    <div id="U9-account-logout-content">

      <h2>
        你确认退出吗？
      </h2>

      <div id="U9-account-logout-actions">

        <button
          id="U9-account-logout-no"
          type="button"
        >
          No
        </button>

        <button
          id="U9-account-logout-yes"
          type="button"
          disabled
        >
          Yes (<span id="U9-account-logout-countdown">5</span>)
        </button>

      </div>

    </div>

  </div>

  <!-- =========================
      MESSAGE MODAL
  ========================= -->
  <div id="U9-message-normal-modal">

    <div id="U9-message-normal-modal-content">

      <div id="U9-message-normal-modal-title">
        Message
      </div>

      <button
        id="U9-message-normal-modal-close"
        type="button"
      >
        ×
      </button>

    </div>

  </div>

  <!-- =========================
      INBOX MODAL
  ========================= -->
  <div id="U9-inbox-normal-modal">

    <div id="U9-inbox-normal-modal-content">

      <div id="U9-inbox-normal-modal-title">
        Inbox
      </div>

      <button
        id="U9-inbox-normal-modal-close"
        type="button"
      >
        ×
      </button>

    </div>

  </div>

  <!-- =========================
      GIFT MODAL
  ========================= -->
  <div id="U9-gift-normal-modal">

    <div id="U9-gift-normal-modal-content">

      <div id="U9-gift-normal-modal-title">
        Gift
      </div>

      <button
        id="U9-gift-normal-modal-close"
        type="button"
      >
        ×
      </button>

    </div>

  </div>

  <!-- =========================
      HISTORY MODAL
  ========================= -->
  <div id="U9-history-normal-modal">

    <div id="U9-history-normal-modal-content">

      <div id="U9-history-normal-modal-title">
        History
      </div>

      <button
        id="U9-history-normal-modal-close"
        type="button"
      >
        ×
      </button>

    </div>

  </div>

  <!-- =========================
      HOME SHARE MODAL
  ========================= -->
  <div id="U9-home-share-modal">

    <div id="U9-home-share-modal-content">

      <div id="U9-home-share-modal-title">
        Share
      </div>

      <button
        id="U9-home-share-modal-close"
        type="button"
        aria-label="Close"
      >
        ×
      </button>

    </div>

  </div>

  <!-- ======== ALL MODAL  ======== -->

</body>
