</div>

<script>

/* =========================================
   SUPABASE EDGE FUNCTION CONFIG
========================================= */

const API_BASE =
    "https://layzcgktgtrqvsgxwwyc.supabase.co/functions/v1";


/* =========================================
   API HELPER
========================================= */

async function apiRequest(
    endpoint,
    options = {}
) {

    const url =
        API_BASE + endpoint;


    const defaultOptions = {

        credentials: "include",

        headers: {

            "Content-Type":
                "application/json"

        }

    };


    const finalOptions = {

        ...defaultOptions,

        ...options,

        headers: {

            ...defaultOptions.headers,

            ...(options.headers || {})

        }

    };


    console.log(
        "API Request:",
        url,
        finalOptions
    );


    const response =
        await fetch(
            url,
            finalOptions
        );


    let data;


    try {

        data =
            await response.json();

    } catch {

        data = {

            success: false,

            error:
                "Server returned invalid JSON"

        };

    }


    document.getElementById(
        "rawResult"
    ).textContent =
        JSON.stringify(
            {
                http_status:
                    response.status,

                response:
                    data
            },
            null,
            2
        );


    return {

        response,

        data

    };

}


/* =========================================
   REGISTER
========================================= */

async function registerUser() {

    const username =
        document.getElementById(
            "registerUsername"
        ).value.trim();


    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "registerPassword"
        ).value;


    const resultElement =
        document.getElementById(
            "registerResult"
        );


    resultElement.textContent =
        "Registering...";


    if (
        !username ||
        !email ||
        !password
    ) {

        resultElement.textContent =
            "Please fill in all fields.";

        return;

    }


    try {

        const {
            response,
            data
        } =
            await apiRequest(
                "/register",
                {

                    method: "POST",

                    body:
                        JSON.stringify({

                            username,

                            email,

                            password

                        })

                }
            );


        resultElement.textContent =
            JSON.stringify(
                data,
                null,
                2
            );


        if (
            response.ok &&
            data.success
        ) {

            await getMe();

        }

    } catch (error) {

        console.error(
            "Register error:",
            error
        );


        resultElement.textContent =
            "Network error: " +
            error.message;

    }

}


/* =========================================
   LOGIN
========================================= */

async function loginUser() {

    const login =
        document.getElementById(
            "login"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const resultElement =
        document.getElementById(
            "loginResult"
        );


    resultElement.textContent =
        "Logging in...";


    if (
        !login ||
        !password
    ) {

        resultElement.textContent =
            "Please enter username/email and password.";

        return;

    }


    try {

        const {
            response,
            data
        } =
            await apiRequest(
                "/login",
                {

                    method: "POST",

                    body:
                        JSON.stringify({

                            login,

                            password

                        })

                }
            );


        resultElement.textContent =
            JSON.stringify(
                data,
                null,
                2
            );


        if (
            response.ok &&
            data.success
        ) {

            await getMe();

        }

    } catch (error) {

        console.error(
            "Login error:",
            error
        );


        resultElement.textContent =
            "Network error: " +
            error.message;

    }

}


/* =========================================
   ME
========================================= */

async function getMe() {

    const resultElement =
        document.getElementById(
            "meResult"
        );


    resultElement.textContent =
        "Checking session...";


    try {

        const {
            response,
            data
        } =
            await apiRequest(
                "/me",
                {

                    method: "GET"

                }
            );


        resultElement.textContent =
            JSON.stringify(
                data,
                null,
                2
            );


        updateUserInterface(
            data
        );


        return data;

    } catch (error) {

        console.error(
            "Me error:",
            error
        );


        resultElement.textContent =
            "Network error: " +
            error.message;


        updateUserInterface({

            success: false,

            logged_in: false

        });


        return null;

    }

}


/* =========================================
   UPDATE USER UI
========================================= */

function updateUserInterface(
    data
) {

    const statusElement =
        document.getElementById(
            "authStatus"
        );


    const userInfo =
        document.getElementById(
            "userInfo"
        );


    if (
        data &&
        data.success &&
        data.logged_in &&
        data.user
    ) {

        const user =
            data.user;


        statusElement.textContent =
            "LOGGED IN";


        userInfo.style.display =
            "block";


        document.getElementById(
            "userId"
        ).textContent =
            user.id ?? "";


        document.getElementById(
            "userUsername"
        ).textContent =
            user.username ?? "";


        document.getElementById(
            "userEmail"
        ).textContent =
            user.email ?? "";


        document.getElementById(
            "userCoins"
        ).textContent =
            user.coins ?? "0.00";


        document.getElementById(
            "userBalance"
        ).textContent =
            user.balance ?? "0.00";


        document.getElementById(
            "userStatus"
        ).textContent =
            user.status ?? "";


        document.getElementById(
            "userCreated"
        ).textContent =
            user.created_at ?? "";

    } else {

        statusElement.textContent =
            "NOT LOGGED IN";


        userInfo.style.display =
            "none";

    }

}


/* =========================================
   LOGOUT
========================================= */

async function logoutUser() {

    const resultElement =
        document.getElementById(
            "logoutResult"
        );


    resultElement.textContent =
        "Logging out...";


    try {

        const {
            response,
            data
        } =
            await apiRequest(
                "/logout",
                {

                    method: "POST"

                }
            );


        resultElement.textContent =
            JSON.stringify(
                data,
                null,
                2
            );


        await getMe();

    } catch (error) {

        console.error(
            "Logout error:",
            error
        );


        resultElement.textContent =
            "Network error: " +
            error.message;

    }

}


/* =========================================
   INITIAL SESSION CHECK
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        getMe();

    }
);

</script>

</body>
