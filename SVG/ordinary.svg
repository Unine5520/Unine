<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200">

  <!-- Main Frame -->
  <circle
    cx="100"
    cy="100"
    r="82"
    fill="none"
    stroke="#000000"
    stroke-width="5"
  />

  <!-- Rotating Cute Dot -->
  <g>

    <circle
      cx="100"
      cy="13"
      r="7"
      fill="#000000"
    />

    <circle
      cx="100"
      cy="13"
      r="3"
      fill="#FFFFFF"
    />

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 100 100"
      to="360 100 100"
      dur="3s"
      repeatCount="indefinite"
    />

  </g>

</svg>
