<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="200"
  height="200"
  viewBox="0 0 200 200"
>

  <defs>

    <linearGradient
      id="frameGradient"
      x1="0"
      y1="0"
      x2="200"
      y2="200"
      gradientUnits="userSpaceOnUse"
    >

      <stop
        offset="0%"
        stop-color="#2874F2"
      />

      <stop
        offset="50%"
        stop-color="#6CB8FF"
      />

      <stop
        offset="100%"
        stop-color="#2874F2"
      />

    </linearGradient>

  </defs>


  <!-- MAIN FRAME -->

  <circle
    cx="100"
    cy="100"
    r="82"
    fill="none"
    stroke="url(#frameGradient)"
    stroke-width="6"
  />


</svg>
