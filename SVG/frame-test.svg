<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200">

  <defs>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Main Frame -->
  <circle
    cx="100"
    cy="100"
    r="82"
    fill="none"
    stroke="#000000"
    stroke-width="5"
  />

  <!-- Cute Stars -->
  <g fill="#000000">

    <path d="
      M 100 7
      L 103 14
      L 110 17
      L 103 20
      L 100 27
      L 97 20
      L 90 17
      L 97 14
      Z
    ">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 100 100"
        to="360 100 100"
        dur="5s"
        repeatCount="indefinite"
      />
    </path>

    <circle cx="170" cy="55" r="3">
      <animate
        attributeName="r"
        values="3;5;3"
        dur="1.5s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="32" cy="135" r="3">
      <animate
        attributeName="r"
        values="3;5;3"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </circle>

  </g>

</svg>
